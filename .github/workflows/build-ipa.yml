name: Build IPA

# Builds an unsigned Amethyst .ipa on a GitHub-hosted macOS runner.
# The old workflows (development.yml.disabled / release.yml.disabled) needed private
# self-hosted runners ("J316sAP", "MacStadium") that only the original authors had.
#
# Run it by hand: Actions tab -> "Build IPA" -> "Run workflow".
# The result is in the run page under "Artifacts" (zip with the .ipa inside).
# The IPA is NOT signed: install it with AltStore / SideStore / Sideloadly / KSign /
# LiveContainer / TrollStore.

on:
  workflow_dispatch:
    inputs:
      release_build:
        description: "Optimized (Release) native build. Leave off for the default Debug build."
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  # Optional: set a repository variable JRE_BASE_URL (Settings -> Secrets and variables ->
  # Actions -> Variables) to a folder URL holding your own copies of
  # jre8-ios-aarch64.zip, jre17-ios-aarch64.zip, jre21-ios-aarch64.zip, jre25-ios-aarch64.zip.
  JRE_BASE_URL: ${{ vars.JRE_BASE_URL }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  build:
    name: Build iOS IPA
    # Change the label with a repository variable MACOS_RUNNER if GitHub retires macos-15.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 120

    steps:
      # Submodules are required: AFNetworking, fishhook, DBNumberedSlider and MobileGlues.
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Makefile compiles the Java part with a JDK 8 compiler.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install build tools
        run: |
          set -euo pipefail
          # gmake: the Makefile needs GNU make 4+, macOS ships 3.81
          # ldid:  fake-signs the app so it can be re-signed by a sideloader
          brew install make ldid
          command -v cmake >/dev/null || brew install cmake
          echo "--- tool versions ---"
          gmake --version | head -1
          cmake --version | head -1
          command -v ldid curl
          "$JAVA_HOME/bin/javac" -version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      # The iOS Java runtimes are not in the repository. The Makefile can download them itself,
      # but doing it here lets us try several places and fail with a clear message.
      # With RUNNER=1 below, the Makefile skips its own download and uses these files.
      - name: Download Java runtimes (JRE 8, 17, 21, 25)
        run: |
          set -euo pipefail
          mkdir -p depends
          cd depends

          fetch_jre() {
            local v="$1"; shift
            local url
            for url in "$@"; do
              [ -n "$url" ] || continue
              echo "JRE ${v}: trying ${url}"
              rm -f "jre${v}.zip"
              if curl -fsSL --retry 3 --retry-delay 5 -o "jre${v}.zip" "$url" && unzip -tq "jre${v}.zip" >/dev/null 2>&1; then
                unzip -oq "jre${v}.zip"
                rm -f "jre${v}.zip"
                if ls jre${v}-*.tar.xz >/dev/null 2>&1; then
                  echo "JRE ${v}: OK ($(ls jre${v}-*.tar.xz))"
                  return 0
                fi
                echo "JRE ${v}: the archive did not contain jre${v}-*.tar.xz, trying the next source"
              fi
            done
            echo "::error::Could not download JRE ${v}. Host jre${v}-ios-aarch64.zip yourself (it must contain jre${v}-ios-aarch64.tar.xz) and set the repository variable JRE_BASE_URL to its folder URL."
            return 1
          }

          # Same addresses the Makefile uses, plus an optional own mirror tried first.
          AME="https://assets.angelauramc.dev/openjdk/ios-arm64"
          fetch_jre 8  "${JRE_BASE_URL:+$JRE_BASE_URL/jre8-ios-aarch64.zip}"  "$AME/jre8-ios-aarch64.zip" \
                       "https://nightly.link/PojavLauncherTeam/android-openjdk-build-multiarch/workflows/build/buildjre8/jre8-ios-aarch64.zip"
          fetch_jre 17 "${JRE_BASE_URL:+$JRE_BASE_URL/jre17-ios-aarch64.zip}" "$AME/jre17-ios-aarch64.zip" \
                       "https://nightly.link/PojavLauncherTeam/android-openjdk-build-multiarch/workflows/build/buildjre17-21/jre17-ios-aarch64.zip"
          fetch_jre 21 "${JRE_BASE_URL:+$JRE_BASE_URL/jre21-ios-aarch64.zip}" "$AME/jre21-ios-aarch64.zip" \
                       "https://nightly.link/PojavLauncherTeam/android-openjdk-build-multiarch/workflows/build/buildjre17-21/jre21-ios-aarch64.zip"
          fetch_jre 25 "${JRE_BASE_URL:+$JRE_BASE_URL/jre25-ios-aarch64.zip}" "$AME/jre25-ios-aarch64.zip"

          ls -lh

      - name: Build IPA
        env:
          RELEASE: ${{ inputs.release_build && '1' || '0' }}
        run: |
          set -euo pipefail
          # RUNNER=1: use the JREs downloaded above instead of letting the Makefile fetch them.
          # PLATFORM=2: a real iOS device (arm64).
          # "dsym package" builds the native app (including MobileGlues), the Java part,
          # assets and zips the .ipa.
          gmake -j"$(sysctl -n hw.ncpu)" dsym package \
            PLATFORM=2 RUNNER=1 RELEASE="$RELEASE" BOOTJDK="$JAVA_HOME/bin" 2>&1 | tee build.log

      - name: Find the IPA
        id: ipa
        run: |
          set -euo pipefail
          ls -lh artifacts/*.ipa
          IPA="$(ls artifacts/org.angelauramc.amethyst-*-ios.ipa | head -1)"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "IPA: $IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-offline-ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Proof that the Microsoft login really is gone from the compiled app.
      # Runs after the upload, so a failed check never withholds a finished build.
      - name: Check that the Microsoft login is not in the binary
        run: |
          set -euo pipefail
          IPA="${{ steps.ipa.outputs.path }}"
          unzip -p "$IPA" Payload/AngelAuraAmethyst.app/AngelAuraAmethyst > /tmp/Amethyst.bin
          HITS="$(strings /tmp/Amethyst.bin | grep -c -E 'login\.live\.com|user\.auth\.xboxlive\.com|api\.minecraftservices\.com/authentication' || true)"
          echo "Microsoft/Xbox login URLs found in the binary: ${HITS}"
          if [ "$HITS" != "0" ]; then
            echo "::error::The Microsoft login code is still in the app."
            exit 1
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            Natives/build/CMakeFiles/*.log
          if-no-files-found: ignore
